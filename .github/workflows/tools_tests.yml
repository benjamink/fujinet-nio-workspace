name: Tool tests

# The workspace's own Python tools (tools/): the Amiga and C64 emulator drivers,
# the BBC disc image writer and the build tasks. Pure Python; no emulator.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: python3 -m pip install pytest pyyaml pillow

      # tools/build is a package named "build", which tools/ on PYTHONPATH
      # would shadow, so it runs on its own.
      - name: Build tasks
        run: python3 -m pytest tools/build/tests -q

      - name: Emulator drivers and BBC image writer
        env:
          PYTHONPATH: tools
        run: python3 -m pytest tools/amiga_emulator/tests tools/c64_emulator/tests tools/bbc_image/tests -q
