id: wb13
display_name: "AmigaOS Workbench 1.3"
os_version: "1.3"
kickstart_var: AMIGA_WB13_KICKSTART
rom_key_var: AMIGA_WB13_ROM_KEY

assembly:
  # The source is a manually installed, bootable, licensed HDF. The builder
  # copies it into a disposable machine-keyed E2E base; it never edits source.
  method: prebuilt_hdf
  machine: required
  source_hdf_var: AMIGA_WB13_HDF
