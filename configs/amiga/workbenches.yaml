default: wb32-a1200

# Host directories Amiberry mounts as guest volumes for interactive workbench.
# Profiles opt in by listing share names under `shares:`. The launcher never
# writes these into the persistent Workbench HDF; sync (default true) only
# refreshes the host directory with symlinks to current build artifacts.
shares:
  NIO:
    volume: NIO
    path: ${NIO_WORKSPACE}/build/amiga-share
    writable: false
    sync: true
  # Versioned package shares are assembled before their matching Workbench
  # profile boots.  Unlike NIO, they never select a binary from an unprofiled
  # last build.
  NIO-WB13:
    volume: NIO
    path: ${NIO_WORKSPACE}/build/amiga-artifacts/wb13/NIO
    writable: false
    sync: false
  NIO-WB31:
    volume: NIO
    path: ${NIO_WORKSPACE}/build/amiga-artifacts/wb31/NIO
    writable: false
    sync: false
  NIO-WB32:
    volume: NIO
    path: ${NIO_WORKSPACE}/build/amiga-artifacts/wb32/NIO
    writable: false
    sync: false
  # Story 1.10 guest endpoint. E2E cases mount a per-run host directory as
  # NATIVE: with filesystem2=rw; interactive sessions can opt in here.
  NATIVE:
    volume: NATIVE
    path: ${NIO_WORKSPACE}/build/amiga-native-test
    writable: true
    sync: false

profiles:
  # Interactive Workbench sessions — point harddrive at your own persistent VHD/HDF.
  # The environment provides kickstart; the machine provides CPU/chipset/RAM settings.
  # To use a pre-built base image instead of a personal one, set harddrive to the
  # output of: scripts/amiga-env build <env_id> --machine <machine_id>

  wb32-a1200:
    environment: wb32
    machine: a1200-030
    harddrive: ${NIO_WORKSPACE}/images/amigaos3.2-run.vhd
    artifact_profile: wb32
    shares: [NIO-WB32]

  wb32-a500:
    environment: wb32
    machine: a500-030
    harddrive: ${NIO_WORKSPACE}/images/amigaos3.2-a500-run.vhd
    artifact_profile: wb32
    shares: [NIO-WB32]

  wb31-a1200:
    environment: wb31
    machine: a1200-030
    harddrive: ${NIO_WORKSPACE}/images/amigaos3.1-run.hdf
    artifact_profile: wb31
    shares: [NIO-WB31]

  wb13-adf:
    disk: ${AMIGA_WB13_ADF_WORKBENCH}
    kickstart: ${AMIGA_WB13_KICKSTART}
    rom_key: ${AMIGA_WB13_ROM_KEY}
    artifact_profile: wb13
    shares: [NIO-WB13]
    settings:
      chipmem_size: 512
      fastmem_size: 0
      cpu_compatible: true
      cachesize: 0

  wb13-a500:
    machine: a500-000
    harddrive: ${AMIGA_WB13_HDF_MUTABLE}
    kickstart: ${AMIGA_WB13_KICKSTART}
    rom_key: ${AMIGA_WB13_ROM_KEY}
    artifact_profile: wb13
    shares: [NIO-WB13]
    settings:
      chipmem_size: 1
      fastmem_size: 1
      cpu_compatible: true
      cachesize: 0
      cpu_speed: max
